[project]
name = "drone-manager-api"
version = "1.0.0"
description = "Drone fleet management and analytics"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115,<1.0",
  "uvicorn[standard]>=0.30,<1.0",
  "firebase-admin>=6.5,<8.0",
  "python-dotenv>=1.0,<2.0",
  "pydantic>=2.8,<3.0",
]

[tool.vercel]
entrypoint = "backend.app.main:app"